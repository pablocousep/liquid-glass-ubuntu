[appfolder]
blur=true
blur-behind-folders=true
pipeline='pipeline_web_frost'
pipeline-auto-mode=true
pipeline-dark='pipeline_web_frost'
pipeline-light='pipeline_web_frost_light'

[applications]
blur=true
blur-on-overview=false
dynamic-opacity=false
enable-all=true
opacity=255
pipeline='pipeline_web_glass'
pipeline-auto-mode=true
pipeline-dark='pipeline_web_glass'
pipeline-light='pipeline_web_glass_light'
rounded-corners=0
sigma=22
whitelist=['*ptyxis*']

[dash-to-dock]
blur=true
override-background=true
pipeline='pipeline_web_glass'
pipeline-auto-mode=true
pipeline-dark='pipeline_web_glass'
pipeline-light='pipeline_web_glass_light'
static-blur=false
style-dash-to-dock=0

[panel]
blur=true
corner-radius=16
override-background=true
pipeline='pipeline_web_panel'
pipeline-auto-mode=true
pipeline-dark='pipeline_web_panel'
pipeline-light='pipeline_web_panel_light'
rounded-corners=0
sigma=24
static-blur=false
style-panel=0

[popup]
blur=true
pipeline='pipeline_web_frost'
pipeline-auto-mode=true
pipeline-dark='pipeline_web_frost'
pipeline-light='pipeline_web_frost_light'
